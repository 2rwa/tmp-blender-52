name: Yokohama Workbench wireframe

on:
  push:
    branches: [main]
    paths:
      - 'experiments/yokohama-terrain-workbench-wire/**'
      - '.github/workflows/yokohama-terrain-workbench-wire.yml'
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  render-publish-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      BLENDER_VERSION: "5.2.2"
      EXPERIMENT: yokohama-terrain-workbench-wire

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Cheap Python preflight
        run: |
          python3 -m py_compile "experiments/$EXPERIMENT/scene.py" tools/build_pages.py

      - name: Restore Blender 5.2 runtime cache
        uses: actions/cache/restore@v6
        with:
          path: .cache/blender52-runtime
          key: blender-runtime-${{ runner.os }}-x64-${{ env.BLENDER_VERSION }}-v1
          fail-on-cache-miss: true

      - name: Configure Blender 5.2 runtime
        run: |
          echo "$GITHUB_WORKSPACE/.cache/blender52-runtime/blender" >> "$GITHUB_PATH"
          echo "PYTHONPATH=$GITHUB_WORKSPACE/.cache/blender52-runtime/python" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$GITHUB_WORKSPACE/.cache/blender52-runtime/egl/usr/lib/x86_64-linux-gnu:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"

      - name: Render 144 Workbench wireframe frames
        run: |
          set -o pipefail
          rm -rf output52
          mkdir -p output52/frames
          blender --version | tee output52/blender-version.txt
          start_epoch="$(date +%s)"
          LIBGL_ALWAYS_SOFTWARE=1 SDL_AUDIODRIVER=dummy \
            xvfb-run -a -s "-screen 0 1280x720x24" \
            blender --background \
              --python "experiments/$EXPERIMENT/scene.py" \
              2>&1 | tee output52/blender-scene.log
          end_epoch="$(date +%s)"
          echo "WORKFLOW_BLENDER_SECONDS=$((end_epoch-start_epoch))" | tee output52/workflow-timing.txt

      - name: Build MP4
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -y \
            -framerate 24 \
            -start_number 1 \
            -i output52/frames/frame_%04d.png \
            -c:v libx264 \
            -preset veryfast \
            -crf 27 \
            -pix_fmt yuv420p \
            "output52/$EXPERIMENT.mp4"

      - name: Validate wireframe output
        run: |
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          from PIL import Image, ImageStat

          out = Path("output52")
          exp = "yokohama-terrain-workbench-wire"
          report = json.loads((out / f"{exp}-report.json").read_text())
          frames = sorted((out / "frames").glob("frame_*.png"))
          preview = out / "preview.png"
          blend = out / f"{exp}.blend"
          video = out / f"{exp}.mp4"

          assert report["frame_count"] == 144, report["frame_count"]
          assert len(frames) == 144, len(frames)
          assert "WORKBENCH" in report["engine"], report["engine"]
          assert report.get("display_mode") == "wireframe", report.get("display_mode")
          assert abs(report["vertical_exaggeration"]["start"] - 1.0) < 1e-6
          assert abs(report["vertical_exaggeration"]["end"] - 32.0) < 1e-6
          assert preview.stat().st_size > 1000, preview.stat().st_size
          assert blend.stat().st_size > 100000, blend.stat().st_size
          assert video.stat().st_size > 5000, video.stat().st_size

          with Image.open(preview) as image:
              image.load()
              assert image.size == (320, 180), image.size
              gray = image.convert("L")
              extrema = gray.getextrema()
              stddev = float(ImageStat.Stat(gray).stddev[0])
          assert extrema[1] - extrema[0] > 20, extrema
          assert stddev > 3.0, stddev

          validation = {
              "experiment": exp,
              "created_at": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
              "blender_version": report["blender_version"],
              "engine": report["engine"],
              "display_mode": "wireframe",
              "resolution": report["resolution"],
              "frame_count": report["frame_count"],
              "dem_zoom": report["dem_zoom"],
              "exaggeration_start": report["vertical_exaggeration"]["start"],
              "exaggeration_end": report["vertical_exaggeration"]["end"],
              "render_loop_seconds": round(report["render_loop_seconds"], 6),
              "seconds_per_frame": round(report["seconds_per_frame"], 6),
              "preview_stddev": round(stddev, 3),
              "preview_bytes": preview.stat().st_size,
              "video_size_bytes": video.stat().st_size,
              "blend_size_bytes": blend.stat().st_size,
          }
          (out / "validation.json").write_text(
              json.dumps(validation, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(validation, indent=2, ensure_ascii=False))
          PY

      - name: Rebase latest main before writeback
        run: |
          git fetch origin main
          git rebase origin/main

      - name: Persist result and rebuild Pages
        run: |
          set -euxo pipefail
          rm -rf "results/$EXPERIMENT"
          mkdir -p "results/$EXPERIMENT"
          cp output52/preview.png "results/$EXPERIMENT/preview.png"
          cp "output52/$EXPERIMENT.mp4" "results/$EXPERIMENT/media.mp4"
          cp "output52/$EXPERIMENT.blend" "results/$EXPERIMENT/$EXPERIMENT.blend"
          cp "output52/$EXPERIMENT-report.json" "results/$EXPERIMENT/$EXPERIMENT-report.json"
          cp output52/validation.json "results/$EXPERIMENT/validation.json"
          cp output52/blender-version.txt "results/$EXPERIMENT/blender-version.txt"
          cp output52/workflow-timing.txt "results/$EXPERIMENT/workflow-timing.txt"
          cat > "results/$EXPERIMENT/README.md" <<EOF
          # $EXPERIMENT

          Workbench wireframe preview for Yokohama terrain.

          - 320×180
          - 144 frames / 24 fps
          - vertical exaggeration 1× → 32×
          - engine: BLENDER_WORKBENCH
          - display: wireframe

          ![preview](./preview.png)

          [Play MP4](./media.mp4)
          EOF
          python3 tools/build_pages.py

      - name: Commit and push result plus Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "results/$EXPERIMENT/" docs/
          if git diff --cached --quiet; then
            echo "Result and Pages are already current."
          else
            git commit -m "chore: publish $EXPERIMENT result and Pages"
            git push origin HEAD:main
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Upload full wireframe artifact
        uses: actions/upload-artifact@v4
        with:
          name: yokohama-workbench-wire
          path: |
            output52/preview.png
            output52/yokohama-terrain-workbench-wire.mp4
            output52/yokohama-terrain-workbench-wire.blend
            output52/yokohama-terrain-workbench-wire-report.json
            output52/validation.json
            output52/blender-scene.log
            output52/workflow-timing.txt
          if-no-files-found: error
          retention-days: 7
