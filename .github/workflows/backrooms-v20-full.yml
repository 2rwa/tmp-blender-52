name: Backrooms Variant 20 Full Render

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/backrooms-v20-full.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      BLENDER_VERSION: "5.2.2"
      BACKROOMS_VARIANT: "20"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cheap Python preflight
        run: |
          python3 -m py_compile             experiments/backrooms-note-repro/scene.py             experiments/backrooms-note-repro/validate.py

      - name: Restore Blender 5.2 runtime cache
        id: blender-runtime-cache
        uses: actions/cache/restore@v6
        with:
          path: .cache/blender52-runtime
          key: blender-runtime-${{ runner.os }}-x64-${{ env.BLENDER_VERSION }}-v1

      - name: Require cached Blender runtime
        if: steps.blender-runtime-cache.outputs.cache-hit != 'true'
        run: |
          echo "Expected existing Blender 5.2 runtime cache."
          exit 1

      - name: Configure Blender runtime
        run: |
          echo "$GITHUB_WORKSPACE/.cache/blender52-runtime/blender" >> "$GITHUB_PATH"
          echo "PYTHONPATH=$GITHUB_WORKSPACE/.cache/blender52-runtime/python" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$GITHUB_WORKSPACE/.cache/blender52-runtime/egl/usr/lib/x86_64-linux-gnu:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"

      - name: Verify Blender runtime
        run: |
          blender --version
          command -v xvfb-run

      - name: Render 640x360 24-frame Variant 20
        run: |
          set -o pipefail
          rm -rf output52
          mkdir -p output52/frames
          blender --version | tee output52/blender-version.txt
          LIBGL_ALWAYS_SOFTWARE=1           SDL_AUDIODRIVER=dummy             xvfb-run -a -s "-screen 0 1280x720x24"             blender --background               --python experiments/backrooms-note-repro/scene.py               2>&1 | tee output52/blender-scene.log
          if grep -Fq "Traceback (most recent call last):" output52/blender-scene.log; then
            exit 1
          fi

      - name: Build one-second MP4
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -y             -framerate 24             -start_number 1             -i output52/frames/frame_%04d.png             -c:v libx264             -preset veryfast             -crf 24             -pix_fmt yuv420p             output52/backrooms-note-repro.mp4

      - name: Validate full render
        run: |
          python3 experiments/backrooms-note-repro/validate.py
          cat output52/validation.json
          cat output52/backrooms-note-repro-report.json

      - name: Upload full render
        uses: actions/upload-artifact@v4
        with:
          name: backrooms-v20-640x360-1s
          path: output52/
          if-no-files-found: error
          retention-days: 7
          overwrite: true
