name: Sail Ship Wireframe HD

on:
  push:
    branches: [main]
    paths:
      - 'experiments/sail-ship-wire-hd/**'
      - '.github/workflows/sail-ship-wire-hd.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render-turntable:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      BLENDER_VERSION: "5.2.2"
      EXPERIMENT: sail-ship-wire-hd

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Cheap Python preflight
        run: |
          python3 -m py_compile \
            experiments/sail-ship-wire-hd/scene.py \
            experiments/sail-ship-wire-hd/validate.py

      - name: Restore Blender runtime cache
        id: blender-cache
        uses: actions/cache/restore@v6
        with:
          path: .cache/blender52-runtime
          key: blender-runtime-${{ runner.os }}-x64-${{ env.BLENDER_VERSION }}-v1

      - name: Require cached Blender runtime
        if: steps.blender-cache.outputs.cache-hit != 'true'
        run: |
          echo "Blender runtime cache missing; run the main Blender 5.2 workflow once."
          exit 1

      - name: Configure Blender runtime
        run: |
          echo "$GITHUB_WORKSPACE/.cache/blender52-runtime/blender" >> "$GITHUB_PATH"
          echo "PYTHONPATH=$GITHUB_WORKSPACE/.cache/blender52-runtime/python" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$GITHUB_WORKSPACE/.cache/blender52-runtime/egl/usr/lib/x86_64-linux-gnu:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"

      - name: Render 10 second HD wireframe turntable
        run: |
          set -euo pipefail
          rm -rf output52
          mkdir -p output52/frames
          .cache/blender52-runtime/blender/blender --version | tee output52/blender-version.txt
          LIBGL_ALWAYS_SOFTWARE=1 SDL_AUDIODRIVER=dummy \
            xvfb-run -a -s "-screen 0 1280x720x24" \
            .cache/blender52-runtime/blender/blender --background \
              --python "experiments/$EXPERIMENT/scene.py" \
              2>&1 | tee output52/blender-scene.log
          if grep -Fq "Traceback (most recent call last):" output52/blender-scene.log; then
            exit 1
          fi

      - name: Build MP4
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -y \
            -framerate 24 \
            -start_number 1 \
            -i output52/frames/frame_%04d.png \
            -c:v libx264 \
            -preset veryfast \
            -crf 29 \
            -pix_fmt yuv420p \
            "output52/$EXPERIMENT.mp4"
          ffprobe -v error -show_entries format=format_name,duration -of json "output52/$EXPERIMENT.mp4"

      - name: Validate PNG, MP4 and source identity
        run: |
          python3 "experiments/$EXPERIMENT/validate.py"
          cat output52/validation.json

      - name: Upload full turntable artifact
        uses: actions/upload-artifact@v4
        with:
          name: sail-ship-wire-hd-turntable
          path: output52/
          if-no-files-found: error
          retention-days: 7
          overwrite: true

      - name: Publish result
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main

          rm -rf "results/$EXPERIMENT"
          mkdir -p "results/$EXPERIMENT"
          cp output52/preview.png "results/$EXPERIMENT/preview.png"
          cp "output52/$EXPERIMENT.mp4" "results/$EXPERIMENT/media.mp4"
          cp "output52/$EXPERIMENT-report.json" "results/$EXPERIMENT/$EXPERIMENT-report.json"
          cp output52/validation.json "results/$EXPERIMENT/validation.json"
          cp output52/blender-version.txt "results/$EXPERIMENT/blender-version.txt"
          cat > "results/$EXPERIMENT/README.md" <<'EOF'
          # Sail Ship — Workbench Wireframe HD Turntable

          Actual 1280×720 Blender 5.2 Workbench wireframe render from the bridged `Sail ship.blend`.
          The camera makes one full orbit over 10 seconds at 24 fps (240 actual rendered frames).

          Validation uses `ffprobe` for the MP4 stream/container metadata and `ffmpeg -xerror` for a full decode check.

          ![preview](./preview.png)

          [Play MP4](./media.mp4)
          EOF

          git add "results/$EXPERIMENT/"
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: publish sail ship wireframe turntable"
          if git push origin HEAD:main; then
            exit 0
          fi
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
