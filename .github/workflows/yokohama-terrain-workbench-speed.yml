name: Yokohama Workbench speed test

on:
  push:
    branches: [main]
    paths:
      - 'experiments/yokohama-terrain-workbench-speed/**'
      - '.github/workflows/yokohama-terrain-workbench-speed.yml'
  workflow_dispatch:

concurrency:
  group: yokohama-workbench-speed-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  speed-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BLENDER_VERSION: "5.2.2"
      EXPERIMENT: yokohama-terrain-workbench-speed

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Cheap Python preflight
        run: python3 -m py_compile "experiments/$EXPERIMENT/scene.py"

      - name: Restore Blender 5.2 runtime cache
        uses: actions/cache/restore@v6
        with:
          path: .cache/blender52-runtime
          key: blender-runtime-${{ runner.os }}-x64-${{ env.BLENDER_VERSION }}-v1
          fail-on-cache-miss: true

      - name: Configure Blender 5.2 runtime
        run: |
          echo "$GITHUB_WORKSPACE/.cache/blender52-runtime/blender" >> "$GITHUB_PATH"
          echo "PYTHONPATH=$GITHUB_WORKSPACE/.cache/blender52-runtime/python" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$GITHUB_WORKSPACE/.cache/blender52-runtime/egl/usr/lib/x86_64-linux-gnu:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"

      - name: Render 144 Workbench frames
        run: |
          set -o pipefail
          rm -rf output52
          mkdir -p output52/frames
          blender --version | tee output52/blender-version.txt
          start_epoch="$(date +%s)"
          LIBGL_ALWAYS_SOFTWARE=1 SDL_AUDIODRIVER=dummy \
            xvfb-run -a -s "-screen 0 1280x720x24" \
            blender --background \
              --python "experiments/$EXPERIMENT/scene.py" \
              2>&1 | tee output52/blender-scene.log
          end_epoch="$(date +%s)"
          echo "WORKFLOW_BLENDER_SECONDS=$((end_epoch-start_epoch))" | tee output52/workflow-timing.txt

      - name: Build MP4
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -y \
            -framerate 24 \
            -start_number 1 \
            -i output52/frames/frame_%04d.png \
            -c:v libx264 \
            -preset veryfast \
            -crf 29 \
            -pix_fmt yuv420p \
            "output52/$EXPERIMENT.mp4"

      - name: Validate speed-test output
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          out = Path("output52")
          exp = "yokohama-terrain-workbench-speed"
          report = json.loads((out / f"{exp}-report.json").read_text())
          frames = sorted((out / "frames").glob("frame_*.png"))
          preview = out / "preview.png"
          blend = out / f"{exp}.blend"
          video = out / f"{exp}.mp4"

          assert report["frame_count"] == 144, report["frame_count"]
          assert len(frames) == 144, len(frames)
          assert "WORKBENCH" in report["engine"], report["engine"]
          assert abs(report["vertical_exaggeration"]["start"] - 1.0) < 1e-6
          assert abs(report["vertical_exaggeration"]["end"] - 32.0) < 1e-6
          assert preview.stat().st_size > 1000, preview.stat().st_size
          assert blend.stat().st_size > 100000, blend.stat().st_size
          assert video.stat().st_size > 5000, video.stat().st_size

          validation = {
              "experiment": exp,
              "blender_version": report["blender_version"],
              "engine": report["engine"],
              "resolution": report["resolution"],
              "frame_count": report["frame_count"],
              "dem_zoom": report["dem_zoom"],
              "exaggeration_start": report["vertical_exaggeration"]["start"],
              "exaggeration_end": report["vertical_exaggeration"]["end"],
              "render_loop_seconds": round(report["render_loop_seconds"], 6),
              "seconds_per_frame": round(report["seconds_per_frame"], 6),
              "preview_bytes": preview.stat().st_size,
              "video_size_bytes": video.stat().st_size,
              "blend_size_bytes": blend.stat().st_size,
          }
          (out / "validation.json").write_text(
              json.dumps(validation, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(validation, indent=2, ensure_ascii=False))
          PY

      - name: Persist result
        run: |
          set -euxo pipefail
          rm -rf "results/$EXPERIMENT"
          mkdir -p "results/$EXPERIMENT"
          cp output52/preview.png "results/$EXPERIMENT/preview.png"
          cp "output52/$EXPERIMENT.mp4" "results/$EXPERIMENT/media.mp4"
          cp "output52/$EXPERIMENT.blend" "results/$EXPERIMENT/$EXPERIMENT.blend"
          cp "output52/$EXPERIMENT-report.json" "results/$EXPERIMENT/$EXPERIMENT-report.json"
          cp output52/validation.json "results/$EXPERIMENT/validation.json"
          cp output52/blender-version.txt "results/$EXPERIMENT/blender-version.txt"
          cp output52/workflow-timing.txt "results/$EXPERIMENT/workflow-timing.txt"
          cat > "results/$EXPERIMENT/README.md" <<EOF
          # $EXPERIMENT

          Workbench preview benchmark for Yokohama terrain.

          - 320×180
          - 144 frames / 24 fps
          - vertical exaggeration 1× → 32×
          - engine: BLENDER_WORKBENCH

          ![preview](./preview.png)

          [Play MP4](./media.mp4)
          EOF

      - name: Commit and push result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "results/$EXPERIMENT/"
          if git diff --cached --quiet; then
            echo "Result is already current."
            exit 0
          fi
          git commit -m "chore: publish $EXPERIMENT result"
          if git push origin HEAD:main; then
            exit 0
          fi
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Upload preview and timing artifact
        uses: actions/upload-artifact@v4
        with:
          name: yokohama-workbench-speed
          path: |
            output52/preview.png
            output52/yokohama-terrain-workbench-speed.mp4
            output52/yokohama-terrain-workbench-speed.blend
            output52/yokohama-terrain-workbench-speed-report.json
            output52/validation.json
            output52/blender-scene.log
            output52/workflow-timing.txt
          if-no-files-found: error
          retention-days: 7
