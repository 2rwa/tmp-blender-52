name: Blender 5.2 feature showcase

on:
  push:
    branches: [main]
    paths:
      - 'experiments/feature52-*/**'
      - 'experiments/_shared/showcase52.py'
      - 'experiments/_shared/validate_showcase52.py'
      - '.github/workflows/blender52-feature-showcase.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blender52-feature-showcase-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        experiment:
          - feature52-cloth-tearing
          - feature52-thin-wall
          - feature52-shader-scene-time
          - feature52-compositor-blank-image
          - feature52-compositor-string-to-image
    env:
      BLENDER_VERSION: "5.2.2"
      EXPERIMENT: ${{ matrix.experiment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cheap Python preflight
        run: |
          python3 -m py_compile "experiments/$EXPERIMENT/scene.py" "experiments/$EXPERIMENT/validate.py"
          if [[ "$EXPERIMENT" != "feature52-cloth-tearing" ]]; then
            python3 -m py_compile experiments/_shared/showcase52.py experiments/_shared/validate_showcase52.py
          fi

      - name: Restore Blender 5.2 runtime cache
        id: blender-runtime-cache
        uses: actions/cache/restore@v6
        with:
          path: .cache/blender52-runtime
          key: blender-runtime-${{ runner.os }}-x64-${{ env.BLENDER_VERSION }}-v1

      - name: Build Blender 5.2 runtime if cache is missing
        if: steps.blender-runtime-cache.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          rm -rf .cache/blender52-runtime
          mkdir -p .cache/blender52-runtime/blender .cache/blender52-runtime/python .cache/blender52-runtime/egl .cache/blender52-runtime/apt
          archive="blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          base_url="https://download.blender.org/release/Blender5.2"
          aria2c -x 8 -s 8 -d /tmp -o "$archive" "$base_url/$archive"
          curl -fsSL "$base_url/blender-${BLENDER_VERSION}.sha256" -o /tmp/blender52.sha256
          (cd /tmp && grep "  $archive$" blender52.sha256 | sha256sum -c -)
          tar -xf "/tmp/$archive" -C .cache/blender52-runtime/blender --strip-components=1
          python3 -m pip install --disable-pip-version-check --no-compile --target .cache/blender52-runtime/python "Pillow==10.2.0"
          sudo apt-get update
          (cd .cache/blender52-runtime/apt && apt-get download libegl1)
          dpkg-deb -x .cache/blender52-runtime/apt/libegl1_*.deb .cache/blender52-runtime/egl

      - name: Configure Blender runtime
        run: |
          echo "$GITHUB_WORKSPACE/.cache/blender52-runtime/blender" >> "$GITHUB_PATH"
          echo "PYTHONPATH=$GITHUB_WORKSPACE/.cache/blender52-runtime/python" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$GITHUB_WORKSPACE/.cache/blender52-runtime/egl/usr/lib/x86_64-linux-gnu:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"

      - name: Verify Blender 5.2.2
        run: |
          blender --version
          LIBGL_ALWAYS_SOFTWARE=1 SDL_AUDIODRIVER=dummy \
            xvfb-run -a -s "-screen 0 1280x720x24" \
            blender --background \
              --python-expr "import bpy; assert bpy.app.version[:3] == (5,2,2); print('BLENDER52_SHOWCASE_OK', bpy.app.version_string)"

      - name: Render experiment
        run: |
          set -o pipefail
          rm -rf output52
          mkdir -p output52/frames
          blender --version | tee output52/blender-version.txt
          LIBGL_ALWAYS_SOFTWARE=1 SDL_AUDIODRIVER=dummy \
            xvfb-run -a -s "-screen 0 1280x720x24" \
            blender --background \
              --python "experiments/$EXPERIMENT/scene.py" \
              2>&1 | tee output52/blender-scene.log
          if grep -Fq "Traceback (most recent call last):" output52/blender-scene.log; then
            echo "Blender Python traceback detected."
            exit 1
          fi

      - name: Build MP4
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -y -framerate 24 -start_number 1 -i output52/frames/frame_%04d.png \
            -c:v libx264 -preset veryfast -crf 29 -pix_fmt yuv420p "output52/$EXPERIMENT.mp4"

      - name: Ensure validation dependency
        run: python3 -m pip install --disable-pip-version-check --no-compile "Pillow==10.2.0"

      - name: Validate actual rendered output
        run: |
          python3 "experiments/$EXPERIMENT/validate.py"
          cat output52/validation.json

      - name: Upload render artifact
        uses: actions/upload-artifact@v4
        with:
          name: blender52-${{ matrix.experiment }}
          path: output52/
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  publish:
    needs: render
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main

      - name: Download all five validated artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: blender52-feature52-*
          path: feature-artifacts

      - name: Persist showcase results
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import shutil
          from pathlib import Path
          experiments = [
              "feature52-cloth-tearing",
              "feature52-thin-wall",
              "feature52-shader-scene-time",
              "feature52-compositor-blank-image",
              "feature52-compositor-string-to-image",
          ]
          root = Path("feature-artifacts")
          results = Path("results")
          for exp in experiments:
              src = root / f"blender52-{exp}"
              dst = results / exp
              if not (src / "validation.json").is_file():
                  raise SystemExit(f"missing validation artifact for {exp}: {src}")
              if dst.exists():
                  shutil.rmtree(dst)
              dst.mkdir(parents=True)
              for source_name, target_name in [
                  ("preview.png", "preview.png"),
                  (f"{exp}.mp4", "media.mp4"),
                  (f"{exp}.blend", f"{exp}.blend"),
                  (f"{exp}-report.json", f"{exp}-report.json"),
                  ("validation.json", "validation.json"),
                  ("blender-version.txt", "blender-version.txt"),
              ]:
                  source = src / source_name
                  if source.is_file():
                      shutil.copy2(source, dst / target_name)
              manifest = json.loads((Path("experiments") / exp / "experiment.json").read_text(encoding="utf-8"))
              validation = json.loads((src / "validation.json").read_text(encoding="utf-8"))
              readme = [
                  f"# {manifest['title']}", "", manifest["description"], "",
                  f"- source commit: {os.environ['SOURCE_COMMIT']}",
                  f"- Actions run: {os.environ['RUN_NUMBER']} ({os.environ['RUN_ID']})",
                  f"- Blender: {validation.get('blender_version')}", "",
                  "![preview](./preview.png)", "", "[Play MP4](./media.mp4)", "",
                  "Validation JSON is stored in validation.json.", "",
              ]
              (dst / "README.md").write_text("\n".join(readme), encoding="utf-8")
          PY

      - name: Commit all five results together
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/feature52-*/
          if git diff --cached --quiet; then
            echo "Showcase results are already current."
            exit 0
          fi
          git commit -m "chore: publish Blender 5.2 feature showcase"
          if git push origin HEAD:main; then
            exit 0
          fi
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
