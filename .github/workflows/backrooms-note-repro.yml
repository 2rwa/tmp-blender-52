name: Backrooms note reproduction

on:
  push:
    branches: [main]
    paths:
      - 'experiments/backrooms-note-repro/**'
      - '.github/workflows/backrooms-note-repro.yml'
      - '.github/workflows/blender52-render.yml'
  workflow_dispatch:
    inputs:
      full_render:
        description: Run 640x360 full render after the 320x180 preview gate
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BLENDER_VERSION: "5.2.2"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cheap Python preflight
        run: |
          python3 -m py_compile             experiments/backrooms-note-repro/scene.py             experiments/backrooms-note-repro/preview_validate.py

      - name: Restore Blender 5.2 runtime cache
        id: blender-runtime-cache
        uses: actions/cache/restore@v6
        with:
          path: .cache/blender52-runtime
          key: blender-runtime-${{ runner.os }}-x64-${{ env.BLENDER_VERSION }}-v1

      - name: Build Blender 5.2 runtime cache
        if: steps.blender-runtime-cache.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          rm -rf .cache/blender52-runtime
          mkdir -p             .cache/blender52-runtime/blender             .cache/blender52-runtime/python             .cache/blender52-runtime/egl             .cache/blender52-runtime/apt

          archive="blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          base_url="https://download.blender.org/release/Blender5.2"

          aria2c -x 8 -s 8 -d /tmp -o "$archive" "$base_url/$archive"
          curl -fsSL "$base_url/blender-${BLENDER_VERSION}.sha256" -o /tmp/blender52.sha256
          (
            cd /tmp
            grep "  $archive$" blender52.sha256 | sha256sum -c -
          )

          tar -xf "/tmp/$archive"             -C .cache/blender52-runtime/blender             --strip-components=1

          python3 -m pip install             --disable-pip-version-check             --no-compile             --target .cache/blender52-runtime/python             "Pillow==10.2.0"

          sudo apt-get update
          (
            cd .cache/blender52-runtime/apt
            apt-get download libegl1
          )
          dpkg-deb -x .cache/blender52-runtime/apt/libegl1_*.deb .cache/blender52-runtime/egl

      - name: Configure Blender 5.2 runtime
        run: |
          echo "$GITHUB_WORKSPACE/.cache/blender52-runtime/blender" >> "$GITHUB_PATH"
          echo "PYTHONPATH=$GITHUB_WORKSPACE/.cache/blender52-runtime/python" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$GITHUB_WORKSPACE/.cache/blender52-runtime/egl/usr/lib/x86_64-linux-gnu:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"

      - name: Save Blender runtime cache
        if: steps.blender-runtime-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .cache/blender52-runtime
          key: blender-runtime-${{ runner.os }}-x64-${{ env.BLENDER_VERSION }}-v1

      - name: Render 320x180 composition preview
        run: |
          set -o pipefail
          rm -rf output52-preview
          mkdir -p output52-preview/frames
          BACKROOMS_FAST_PREVIEW=1           BACKROOMS_OUTPUT=output52-preview           LIBGL_ALWAYS_SOFTWARE=1           SDL_AUDIODRIVER=dummy             xvfb-run -a -s "-screen 0 640x360x24"             blender --background               --python experiments/backrooms-note-repro/scene.py               2>&1 | tee output52-preview/blender-preview.log
          if grep -Fq "Traceback (most recent call last):" output52-preview/blender-preview.log; then
            echo "Blender Python traceback detected."
            exit 1
          fi

      - name: Validate composition preview
        run: |
          python3 experiments/backrooms-note-repro/preview_validate.py
          cat output52-preview/preview-validation.json

      - name: Upload composition preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backrooms-320x180-preview
          path: output52-preview/
          if-no-files-found: warn
          retention-days: 7
          overwrite: true

  reproduce:
    needs: preview
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.full_render) ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[full]'))
    uses: 2rwa/tmp-blender-52/.github/workflows/blender52-render.yml@main
    with:
      experiment: backrooms-note-repro
